<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f6f8"><title>Control de gastos — Diseño de ejemplo</title><link rel="stylesheet" href="demo.css?v=readable-evolution-2"></head>
<body><div class="app"><header><div><span class="eyebrow">TU CONTABILIDAD PERSONAL</span><h1>Control de gastos</h1></div><button id="theme" type="button" aria-label="Cambiar tema">Oscuro</button></header><div class="demo-note"><span class="dot"></span> Diseño de ejemplo · todos los importes son ficticios</div><main id="screen"></main><nav aria-label="Pestañas principales, deslizable horizontalmente"><button data-tab="home">Inicio</button><button data-tab="cash">Efectivo</button><button data-tab="virtual">Virtual</button><button data-tab="evolution">Evolución</button><button data-tab="movements">Movimientos</button><button data-tab="categories">Categorías</button><button data-tab="backup">Respaldo</button></nav><p class="foot">Demostración visual sin conexión a Firebase. <a href="./">Volver a configuración</a></p></div><dialog id="movement"><form id="movement-form"><div class="dialog-title"><h2 id="dialog-title"></h2><button type="button" id="close-modal" aria-label="Cerrar">×</button></div><label id="type-label">Tipo<select id="type"><option value="expense">Gasto</option><option value="income">Otro ingreso</option><option value="transfer">Transferencia a la otra ubicación</option><option value="month">Pase manual a otro mes</option><option value="saving-out">Enviar a Ahorro / Préstamos</option><option value="saving-in">Traer desde Ahorro / Préstamos</option></select></label><label id="edit-location-label" hidden>Ubicación de origen<select id="edit-location"><option value="cash">Efectivo</option><option value="virtual">Virtual</option></select></label><label id="category-label">Categoría<select id="category"></select></label><label>Importe en pesos<input id="amount" inputmode="decimal" placeholder="0,00" required autocomplete="off"></label><label id="description-label">Descripción<input id="description" maxlength="100" placeholder="¿Para qué fue?"></label><label id="date-label">Fecha<input id="date" type="date" required></label><label id="source-month-label" hidden>Mes de origen<input id="source-month" type="month"></label><label id="month-label" hidden>Mes de destino<input id="destination" type="month"></label><fieldset id="income-source"><legend>Origen del ingreso</legend><label><input name="incomeSource" type="radio" value="own" checked> Propio</label><label><input name="incomeSource" type="radio" value="contribution"> Aporte de otra persona</label></fieldset><p id="modal-note" class="muted"></p><p id="form-error" role="alert"></p><button class="primary" id="save-movement" type="submit">Agregar solo al ejemplo</button><button type="button" class="danger" id="delete-movement" hidden>Eliminar movimiento</button><p class="muted">Al recargar se descartan los cambios de esta demostración.</p></form></dialog><div id="toast" role="status" aria-live="polite"></div><script src="theme.js"></script><script type="module" src="demo.js?v=readable-evolution-2"></script></body></html>
